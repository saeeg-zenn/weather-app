<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather for {{ city_name }}</title>
</head>
<body>

    <h1>{{ city_name }}</h1>

    <p>Temperature: {{ temperature }}°C</p>
    <p>Feels like: {{ feels_like }}°C</p>
    <p>Condition: {{ description }}</p>
    <p>Humidity: {{ humidity }}%</p>
    <p>Sunrise: {{ sunrise }}</p>
    <p>Sunset: {{ sunset }}</p>

    <a href="/">Search another city</a>

</body>
</html>
